name: gemotion-local

x-app-environment: &app-environment
  RAILS_ENV: production
  DATABASE_URL: postgres://gemotion:gemotion@db:5432/gemotion_production
  REDIS_URL: redis://redis:6379/1
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:-local_only_secret_key_base_000000000000000000000000000000000000000000000000000000}
  FORCE_SSL: "false"
  RAILS_SERVE_STATIC_FILES: "true"
  APP_HOST: 127.0.0.1:3300
  APP_PROTOCOL: http
  GMAIL_USERNAME: ${GMAIL_USERNAME:-review@example.com}
  GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-local-dummy-password}
  MAILER_FROM: ${MAILER_FROM:-review@example.com}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gemotion
      POSTGRES_PASSWORD: gemotion
      POSTGRES_DB: gemotion_production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gemotion -d gemotion_production"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    # Local queues are disposable. Disabling snapshots also prevents Redis from
    # rejecting Sidekiq writes when Docker Desktop is temporarily low on space.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3300:3000"
    volumes:
      - shared_storage:/shared
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/up"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  worker:
    build:
      context: .
    environment: *app-environment
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - shared_storage:/shared

volumes:
  postgres_data:
  shared_storage:
