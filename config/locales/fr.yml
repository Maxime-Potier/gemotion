    testimonials:
      customer: "Client"
      first: "E Motions-video nous a fait un film pour notre départ de Dubaï, un film chargé en émotions et une véritable page de vie de notre famille. On y retrouve les meilleurs moments de ces six années et une très belle surprise de nos amis, orchestrée avec beaucoup d'humour."
      second: "L'un des plus beaux cadeaux jamais reçus ! Quelle émotion de voir s'animer ces photos qui me rappellent tant de beaux souvenirs avec les gens que j'aime. Les messages personnalisés de nos proches effacent les distances et donnent le sentiment d'être entouré."
      third: "Il est souvent difficile de trouver une idée de cadeau, mais ce film a été une évidence. E Motions-video a tout de suite su cerner notre amie et créer un film à son image. La musique, le fil conducteur et le mélange de photos et vidéos en font un cadeau parfait."
