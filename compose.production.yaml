name: gemotion-production

x-app-environment: &app-environment
  RAILS_ENV: production
  RAILS_MAX_THREADS: "3"
  WEB_CONCURRENCY: "1"
  DATABASE_URL: postgres://gemotion:${POSTGRES_PASSWORD}@db:5432/gemotion_production
  REDIS_URL: redis://redis:6379/1
  SECRET_KEY_BASE: ${SECRET_KEY_BASE}
  FORCE_SSL: "true"
  RAILS_SERVE_STATIC_FILES: "true"
  APP_HOST: ${APP_HOST}
  APP_PROTOCOL: https
  GMAIL_USERNAME: ${GMAIL_USERNAME}
  GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
  MAILER_FROM: ${MAILER_FROM}
  STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
  PAYMENT_BYPASS_ENABLED: ${PAYMENT_BYPASS_ENABLED:-false}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gemotion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gemotion_production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gemotion -d gemotion_production"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - shared_storage:/shared
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/up"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  worker:
    build:
      context: .
    restart: unless-stopped
    environment: *app-environment
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml", "-c", "1"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - shared_storage:/shared

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  shared_storage:
  caddy_data:
  caddy_config:
